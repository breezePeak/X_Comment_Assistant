# 放在 Nginx 的 http 配置上下文；替换域名和证书路径后 nginx -t 再重新加载。
limit_req_zone $binary_remote_addr zone=posts_api:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name posts.example.com;
    ssl_certificate /etc/letsencrypt/live/posts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posts.example.com/privkey.pem;

    client_max_body_size 30m;
    location / {
        limit_req zone=posts_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:12345;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
    }
}
